name: Run devenv tests

on:
  workflow_dispatch:
    inputs:
      nixpkgs-input:
        description: "Nixpkgs input to use"
        required: false
        default: "github:tarc/devenv-nixpkgs/main"
        type: string
  workflow_call:
    inputs:
      nixpkgs-input:
        description: "Nixpkgs input to use"
        required: false
        default: "github:tarc/devenv-nixpkgs/main"
        type: string

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: [ubuntu-latest]
            system: x86_64-linux
          - os: [macos-latest]
            system: aarch64-darwin
    uses: cachix/devenv/.github/workflows/test.yml@main
    with:
      repository: tarc/devenv
      ref: ci/disable-kafka-test-for-aarch64-darwin
      nixpkgs-input: ${{ inputs.nixpkgs-input }}
      system: ${{ matrix.system }}
      runs-on: ${{ toJSON(matrix.os) }}
    secrets: inherit

  examples:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: [ubuntu-latest]
            system: x86_64-linux
          - os: [macos-latest]
            system: aarch64-darwin
    uses: tarc/devenv/.github/workflows/examples.yml@ci/parameterize-runs-on-generate-examples
    with:
      repository: tarc/devenv
      nixpkgs-input: ${{ inputs.nixpkgs-input }}
      system: ${{ matrix.system }}
      runs-on: ${{ toJSON(matrix.os) }}
    secrets: inherit
